<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="app-version" content="6.0">
<title>科学计算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #e8eaed;
    display: flex;
    align-items: stretch;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .calc {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    background: #e8eaed;
    padding: 8px 10px 12px;
  }
  .display-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px 6px 14px;
    min-height: 130px;
    position: relative;
  }
  .mode-indicator {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 15px;
    color: #5f6368;
    font-weight: 500;
  }
  .about-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    border: none;
    background: transparent;
    color: #5f6368;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 12px;
    font-family: inherit;
    transition: background 0.1s;
  }
  .about-btn:hover { background: rgba(0,0,0,0.06); }
  .about-btn:active { background: rgba(0,0,0,0.1); }
  .expression {
    text-align: right;
    color: #5f6368;
    font-size: 18px;
    min-height: 24px;
    word-break: break-all;
    line-height: 1.3;
    padding: 0 4px;
    font-family: "Roboto Mono", Consolas, monospace;
  }
  .result {
    text-align: right;
    color: #202124;
    font-size: 40px;
    font-weight: 500;
    word-break: break-all;
    line-height: 1.2;
    padding: 4px 4px 0;
    font-family: "Roboto Mono", Consolas, monospace;
    min-height: 52px;
    cursor: text;
    overflow-y: auto;
    max-height: 100%;
  }
  .ch { display: inline; }
  .caret {
    display: inline-block;
    width: 0;
    border-left: 2px solid #1a73e8;
    height: 1.05em;
    vertical-align: -0.16em;
    animation: caretBlink 1.1s step-end infinite;
    pointer-events: none;
  }
  @keyframes caretBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .btn {
    border: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    border-radius: 14px;
    background: #ffffff;
    color: #202124;
    font-size: 19px;
    font-weight: 500;
    height: 52px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    transition: background 0.1s, transform 0.05s;
    font-family: inherit;
  }
  .btn:active { background: #e0e3e7; transform: scale(0.97); }
  .btn.op { color: #1a73e8; }
  .btn.func { color: #5f6368; font-size: 17px; }
  .btn.mem { color: #5f6368; font-size: 16px; }
  .btn.equals {
    background: #1a73e8;
    color: #fff;
    grid-row: span 2;
    height: auto;
    font-size: 24px;
    border-radius: 16px;
  }
  .btn.equals:active { background: #1557b0; }
  .btn.active { background: #d2e3fc; color: #1a73e8; }
  .btn sup { font-size: 12px; }
  .btn sub { font-size: 11px; }
  @media (max-width: 380px) {
    .btn { font-size: 16px; height: 48px; }
    .btn.func { font-size: 14px; }
    .result { font-size: 32px; }
  }
  /* 关于弹窗 */
  .about-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(32,33,36,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .about-overlay[hidden] { display: none; }
  .about-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 26px 24px 20px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 36px rgba(0,0,0,0.3);
  }
  .about-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 14px;
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    padding: 7px;
    gap: 4px;
  }
  .about-icon span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 600;
    color: #202124;
    border-radius: 10px;
    font-family: "Roboto Mono", Consolas, monospace;
  }
  .about-icon span.eq { background: #1a73e8; color: #fff; }
  .about-title { font-size: 20px; font-weight: 600; color: #202124; }
  .about-sub { font-size: 13px; color: #5f6368; margin-top: 2px; }
  .about-divider { height: 1px; background: #e8eaed; margin: 16px 12px; }
  .about-author { font-size: 18px; font-weight: 600; color: #1a73e8; }
  .about-author-en { font-size: 15px; color: #5f6368; margin-top: 4px; }
  .about-close {
    margin-top: 18px;
    border: none;
    background: #1a73e8;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 32px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
  }
  .about-close:active { background: #1557b0; }
  /* 更新弹窗 */
  .update-card { max-width: 340px; }
  .update-head { font-size: 13px; font-weight: 600; color: #1a73e8; letter-spacing: 0.3px; }
  .update-version { font-size: 26px; font-weight: 700; color: #202124; margin-top: 6px; }
  .update-desc { font-size: 13px; color: #5f6368; margin-top: 10px; line-height: 1.5; }
  .progress-track {
    height: 8px; border-radius: 4px; background: #e8eaed;
    margin: 16px 0 8px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0; background: #1a73e8; border-radius: 4px;
    transition: width 0.2s ease;
  }
  .update-progress-text { font-size: 13px; color: #5f6368; }
  .update-actions {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 18px; flex-wrap: wrap;
  }
  .update-actions .about-close { margin-top: 0; }
  .update-secondary {
    border: none; background: #eef1f5; color: #5f6368;
    font-size: 15px; font-weight: 500; padding: 10px 22px;
    border-radius: 18px; cursor: pointer; font-family: inherit;
  }
  .update-secondary:active { background: #e0e4ea; }
</style>
</head>
<body>
<div class="calc">
  <div class="display-wrap">
    <div class="mode-indicator" id="modeIndicator">Deg</div>
    <button class="about-btn" id="aboutBtn">ⓘ 关于</button>
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keypad" id="keypad"></div>
</div>

<!-- 关于弹窗 -->
<div class="about-overlay" id="aboutOverlay" hidden>
  <div class="about-card">
    <div class="about-icon"><span>+</span><span>−</span><span>×</span><span class="eq">=</span></div>
    <div class="about-title">科学计算器</div>
    <div class="about-sub">Scientific Calculator · v6.0</div>
    <div class="about-divider"></div>
    <div class="about-author">刘宸至一首创作！</div>
    <div class="about-author-en">A creation by Liu Chenzhi!</div>
    <button class="about-close" id="aboutClose">关闭 · Close</button>
  </div>
</div>
<!-- 更新弹窗 -->
<div class="about-overlay" id="updateOverlay" hidden>
  <div class="about-card update-card">
    <div class="update-head" id="updateHead">发现新版本 · New version found</div>
    <div class="update-version" id="updateVersion">v6.0</div>
    <div class="update-desc" id="updateDesc">正在后台下载更新… · Downloading in background…</div>
    <div class="progress-track"><div class="progress-bar" id="updateBar"></div></div>
    <div class="update-progress-text" id="updateProgressText">0%</div>
    <div class="update-actions">
      <button class="about-close" id="updatePrimary">下载中 · Downloading</button>
      <button class="update-secondary" id="updateLater">稍后 · Later</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
